name: Cache Warmup

on:
  schedule:
    # Horário de Brasília = UTC-3
    # 0h, 6h, 12h, 15h BRT = 3h, 9h, 15h, 18h UTC
    - cron: '0 3,9,15,18 * * *'
  workflow_dispatch: # Permite execução manual via GitHub UI

jobs:
  warmup:
    name: Warmup + verificação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Warmup e verificação do cache
        env:
          AUTH_URL: ${{ secrets.AUTHENTICATION_URL }}
          # Fallback para o modelo antigo (usados só se o lhg-api NÃO estiver no ar)
          LUSH_IPIRANGA_URL: ${{ secrets.LUSH_IPIRANGA_URL }}
          LUSH_LAPA_URL: ${{ secrets.LUSH_LAPA_URL }}
          ANDAR_DE_CIMA_URL: ${{ secrets.ANDAR_DE_CIMA_URL }}
          TOUT_URL: ${{ secrets.TOUT_URL }}
          LIV_URL: ${{ secrets.LIV_URL }}
          ALTANA_URL: ${{ secrets.ALTANA_URL }}
        run: |
          set -uo pipefail

          # Deriva o host base a partir do AUTHENTICATION_URL (ex.: https://host/auth/api → https://host)
          BASE="${AUTH_URL%/}"
          BASE="${BASE%/auth/api}"
          BASE="${BASE%/auth}"
          LHG="$BASE/lhg"

          echo "Base: $BASE"

          # ── Detecção de arquitetura ────────────────────────────────────────
          # Se o lhg-api responde em /lhg/health, estamos no backend multi-tenant
          # (cutover OU merge com o lhg-api no ar). Senão, cai no modelo antigo.
          if curl -s --max-time 60 -o /dev/null -w '%{http_code}' "$LHG/health" | grep -q '^200$'; then
            MODE=multitenant
          else
            MODE=legacy
          fi
          echo "Modo detectado: $MODE"

          # ════════════════════════════════════════════════════════════════════
          if [ "$MODE" = "multitenant" ]; then
            echo "→ Warmup único (todas as unidades + consolidado)"
            curl -s -X POST --max-time 120 "$LHG/api/cache/warmup" || true

            # Polling do status agregado (byUnit)
            STATUS='{}'
            for i in $(seq 1 20); do
              STATUS=$(curl -s --max-time 30 "$LHG/api/cache/status" || echo '{}')
              TOTAL=$(echo "$STATUS" | jq -r '.summary.active // 0' 2>/dev/null || echo 0)
              # Nº de unidades com >=12 entradas ativas
              READY=$(echo "$STATUS" | jq -r '[.byUnit // {} | to_entries[] | select(.value.active >= 12)] | length' 2>/dev/null || echo 0)
              echo "  tentativa $i: total=$TOTAL, unidades prontas=$READY"
              [ "${READY:-0}" -ge 6 ] && break
              sleep 30
            done

            {
              echo "## Cache Warmup (multi-tenant) — $LHG"
              echo '```'
              echo "$STATUS" | jq -r '.byUnit // {} | to_entries[] | "\(.key): \(.value.active) ativas"' 2>/dev/null || echo "sem detalhe por unidade"
              echo "TOTAL ativas: $TOTAL"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            # Unidades com 0 entradas provavelmente têm o BANCO DA UNIDADE fora do ar
            # (infra da unidade, não do backend) — reporta como aviso, não falha.
            EMPTY=$(echo "$STATUS" | jq -r '[.byUnit // {} | to_entries[] | select(.value.active == 0) | .key] | join(", ")' 2>/dev/null || echo "")
            if [ -n "$EMPTY" ] && [ "$EMPTY" != "null" ]; then
              echo "::warning::Unidade(s) com cache vazio (provável banco da unidade inacessível): $EMPTY"
            fi

            # FALHA só se o backend estiver realmente quebrado: total criticamente
            # baixo (não é 1 banco de unidade fora, é o warmup inteiro falhando).
            if [ "${TOTAL:-0}" -lt 40 ]; then
              echo "::error::Warmup multi-tenant com apenas $TOTAL entradas ativas — backend possivelmente com problema."
              exit 1
            fi
            echo "OK: $TOTAL entradas ativas."
            exit 0
          fi

          # ════════════════════════════════════════════════════════════════════
          echo "→ Modelo antigo (um endpoint por backend)"
          declare -A URLS=(
            [Lush_Ipiranga]="$LUSH_IPIRANGA_URL" [Lush_Lapa]="$LUSH_LAPA_URL"
            [Andar_de_Cima]="$ANDAR_DE_CIMA_URL" [Tout]="$TOUT_URL"
            [Liv]="$LIV_URL" [Altana]="$ALTANA_URL" [Authentication]="$AUTH_URL"
          )
          for name in "${!URLS[@]}"; do
            u="${URLS[$name]}"; [ -z "$u" ] && continue
            curl -s -X POST --max-time 180 "$u/cache/warmup" >/dev/null || echo "warmup $name falhou (segue)"
          done

          FAILED=""
          for name in "${!URLS[@]}"; do
            u="${URLS[$name]}"; [ -z "$u" ] && continue
            min=12; [ "$name" = "Authentication" ] && min=1
            active=0
            for i in $(seq 1 20); do
              active=$(curl -s --max-time 30 "$u/cache/status" | jq -r '.summary.active // 0' 2>/dev/null || echo 0)
              [ "${active:-0}" -ge "$min" ] && break
              sleep 30
            done
            echo "$name: $active ativas (min $min)" >> "$GITHUB_STEP_SUMMARY"
            if [ "${active:-0}" -eq 0 ]; then
              echo "::warning::$name com cache vazio (provável banco da unidade inacessível)"
            elif [ "${active:-0}" -lt "$min" ]; then
              FAILED="$FAILED $name"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Backends abaixo do mínimo (e não zerados):$FAILED"
            exit 1
          fi

  keepalive:
    name: Keepalive (evita disabled_inactivity)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit vazio se repositório inativo (~50 dias)
        run: |
          # O GitHub desativa workflows agendados após 60 dias SEM commits no repo
          # (runs do próprio Actions NÃO contam como atividade). Este passo cria um
          # commit vazio quando o último commit passa de 50 dias, resetando o contador.
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "Último commit há $DAYS dia(s)."
          if [ "$DAYS" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore(ci): keepalive para manter o cron de warmup ativo"
            git push
          else
            echo "Sem necessidade de keepalive (< 50 dias)."
          fi
